<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f34">
<title>Ideen & Aufgaben</title>
<style>
:root{--bg:#f4f5f0;--grid:rgba(23,63,52,.15);--card:#fff;--text:#18201d;--muted:#69736e;--line:#b7c0ba;--green:#173f34;--green2:#245b4b;--red:#9f3430;--gold:#b27a1c;--later:#587069;--shadow:5px 5px 0 rgba(23,63,52,.16)}
*{box-sizing:border-box}html{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),var(--bg);background-size:22px 22px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,760px);margin:auto;padding:0 15px 36px}.topbar{position:sticky;top:0;z-index:20;margin:0 -15px 24px;padding:max(14px,env(safe-area-inset-top)) 15px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(244,245,240,.95);border-bottom:2px solid var(--green);backdrop-filter:blur(10px)}h1{margin:0;color:var(--green);font-size:clamp(1.35rem,5vw,1.9rem);font-weight:950;letter-spacing:-.045em;text-transform:uppercase}.subtitle{margin:5px 0 0;color:var(--muted);font-size:.75rem;font-weight:800;text-transform:uppercase}.listbtn{width:48px;height:48px;display:grid;place-items:center;color:#fff;background:var(--green);border:2px solid var(--green);border-radius:0;box-shadow:3px 3px 0 rgba(23,63,52,.18)}.listbtn svg{width:25px;height:25px;stroke:currentColor;stroke-width:2.2;fill:none}.screen{display:none}.screen.active{display:block}.panel{padding:20px;background:rgba(255,255,255,.96);border:2px solid var(--green);box-shadow:var(--shadow)}h2{margin:0 0 5px;color:var(--green);font-size:1.08rem;font-weight:950;text-transform:uppercase}.intro{margin:0 0 22px;color:var(--muted);font-size:.9rem;line-height:1.45}.field{margin-bottom:16px}label{display:block;margin:0 0 6px;color:var(--green);font-size:.78rem;font-weight:950;letter-spacing:.055em;text-transform:uppercase}input,select,textarea{width:100%;min-height:50px;padding:11px 12px;color:var(--text);background:#fff;border:2px solid var(--line);border-radius:0;outline:none}textarea{min-height:112px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:3px 3px 0 rgba(23,63,52,.13)}input[readonly]{color:var(--muted);background:#ecefe9}.primary,.secondary{min-height:50px;padding:11px 14px;border:2px solid var(--green);border-radius:0;font-weight:950;text-transform:uppercase}.primary{width:100%;color:#fff;background:var(--green);box-shadow:4px 4px 0 rgba(23,63,52,.18)}.primary:hover{background:var(--green2)}.secondary{color:var(--green);background:#fff}button:active{transform:translate(1px,1px);box-shadow:none}.feedback{min-height:24px;margin-top:12px;color:var(--green);font-size:.84rem;font-weight:850;text-align:center}.listhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.back{width:44px;height:44px;color:var(--green);background:#fff;border:2px solid var(--green);border-radius:0;font-size:1.15rem;font-weight:950}.listtools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.filter{min-height:40px;padding:7px 10px;max-width:210px}.actions{display:flex;gap:7px}.toolicon{width:40px;height:40px;display:grid;place-items:center;padding:0;color:var(--green);background:#fff;border:2px solid var(--green);border-radius:0}.toolicon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}.count{margin:0 0 9px;color:var(--muted);font-size:.74rem;font-weight:850;text-transform:uppercase}.entries{display:grid;gap:7px}.entry{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:8px;padding:8px 9px;background:#f9faf7;border:2px solid var(--line)}.bar{background:var(--later)}.entry[data-p="dringend"] .bar{background:var(--red)}.entry[data-p="normal"] .bar{background:var(--gold)}.title{margin:0 0 4px;font-size:.9rem;font-weight:950;line-height:1.22}.meta{display:flex;flex-wrap:wrap;gap:4px}.tag{padding:2px 5px;color:var(--green);background:#fff;border:1px solid var(--line);font-size:.62rem;font-weight:850;text-transform:uppercase}.entry[data-p="dringend"] .ptag{color:#fff;background:var(--red);border-color:var(--red)}.entry[data-p="normal"] .ptag{color:#332000;background:#e8c274;border-color:var(--gold)}.entryactions{display:flex;align-items:center;gap:5px}.icon{width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--green);background:#fff;border:2px solid var(--line);border-radius:0;font-weight:950}.icon.del{color:var(--red)}.empty{padding:28px 14px;color:var(--muted);background:rgba(255,255,255,.9);border:2px dashed var(--line);text-align:center}.empty strong{display:block;margin-bottom:5px;color:var(--green);text-transform:uppercase}.hidden{display:none}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;padding:18px;background:rgba(10,18,15,.58)}.modal.open{display:flex}.modalcard{width:min(100%,600px);padding:17px;background:#fff;border:2px solid var(--green);box-shadow:7px 7px 0 rgba(0,0,0,.2)}.modalbuttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}@media(min-width:700px){.modal{align-items:center}}@media(max-width:520px){.listtools{align-items:stretch}.filter{max-width:none;flex:1}.entry{grid-template-columns:5px minmax(0,1fr) auto}.entryactions{grid-column:auto;flex-direction:column;justify-content:flex-start}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div><h1>Ideen & Aufgaben</h1><p class="subtitle">Schnell erfassen · später strukturieren</p></div><button class="listbtn" id="openList" aria-label="Einträge anzeigen"><svg viewBox="0 0 24 24"><path d="M7 5h13M7 12h13M7 19h13M3 5h.01M3 12h.01M3 19h.01"/></svg></button></header>
<section class="screen active" id="capture"><div class="panel"><h2>Neuer Eintrag</h2><p class="intro">Gedanken, Aufgaben und mögliche Projekte direkt festhalten.</p><form id="form">
<div class="field"><label for="todo">To-do</label><textarea id="todo" maxlength="500" required placeholder="Was möchtest du festhalten?"></textarea></div>
<div class="field"><label for="duration">Dauer</label><select id="duration"><option value="5">5 Minuten</option><option value="10">10 Minuten</option><option value="15">15 Minuten</option><option value="20">20 Minuten</option><option value="30" selected>30 Minuten</option><option value="45">45 Minuten</option><option value="60">1 Stunde</option><option value="90">1,5 Stunden</option><option value="120">2 Stunden</option><option value="180">3 Stunden</option><option value="240">4 Stunden</option><option value="480">Ganzer Tag</option></select></div>
<div class="field"><label for="priority">Dringlichkeit</label><select id="priority"><option value="dringend">Dringend</option><option value="normal" selected>Normal</option><option value="bei-gelegenheit">Bei Gelegenheit</option></select></div>
<div class="field"><label for="date">Datum der Eintragung</label><input id="date" readonly></div>
<button class="primary" type="submit">Eintrag übernehmen</button><div class="feedback" id="feedback" aria-live="polite"></div>
</form></div></section>
<section class="screen" id="list"><div class="panel"><div class="listhead"><div><h2>Gesammelte Einträge</h2><p class="intro">Nach Dringlichkeit, innerhalb der Stufe nach kürzester Dauer sortiert.</p></div><button class="back" id="back" aria-label="Zurück">←</button></div><div class="listtools"><select class="filter" id="filter" aria-label="Nach Dringlichkeit filtern"><option value="alle">Alle Einträge</option><option value="dringend">Dringend</option><option value="normal">Normal</option><option value="bei-gelegenheit">Bei Gelegenheit</option></select><div class="actions"><button class="toolicon" id="export" aria-label="CSV exportieren" title="CSV exportieren"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button><button class="toolicon" id="import" aria-label="CSV importieren" title="CSV importieren"><svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 4h16"/></svg></button><input class="hidden" id="file" type="file" accept=".csv,text/csv"></div></div><p class="count" id="count"></p><div class="entries" id="entries"></div></div></section>
</main>
<div class="modal" id="modal"><form class="modalcard" id="editForm"><h2>Eintrag bearbeiten</h2><input type="hidden" id="editId"><div class="field"><label for="editTodo">To-do</label><textarea id="editTodo" required></textarea></div><div class="field"><label for="editDuration">Dauer</label><select id="editDuration"><option value="5">5 Minuten</option><option value="10">10 Minuten</option><option value="15">15 Minuten</option><option value="20">20 Minuten</option><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60">1 Stunde</option><option value="90">1,5 Stunden</option><option value="120">2 Stunden</option><option value="180">3 Stunden</option><option value="240">4 Stunden</option><option value="480">Ganzer Tag</option></select></div><div class="field"><label for="editPriority">Dringlichkeit</label><select id="editPriority"><option value="dringend">Dringend</option><option value="normal">Normal</option><option value="bei-gelegenheit">Bei Gelegenheit</option></select></div><div class="modalbuttons"><button class="secondary" type="button" id="cancel">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></div>
<script>
(()=>{"use strict";const KEY="ideen_aufgaben_v1";let data=load();const $=id=>document.getElementById(id),capture=$("capture"),list=$("list"),todo=$("todo"),duration=$("duration"),priority=$("priority"),date=$("date"),entries=$("entries"),count=$("count"),filter=$("filter"),modal=$("modal"),file=$("file");setDate();render();function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}function setDate(){date.value=new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date())}function rank(p){return({dringend:0,normal:1,"bei-gelegenheit":2})[p]??1}function plabel(p){return({dringend:"Dringend",normal:"Normal","bei-gelegenheit":"Bei Gelegenheit"})[p]||"Normal"}function dlabel(n){n=+n||0;if(n===480)return"Ganzer Tag";if(n<60)return n+" Min";const h=Math.floor(n/60),m=n%60;return m?h+" Std "+m+" Min":h+" Std"}function fdate(x){const d=new Date(x);return isNaN(d)?"":new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}).format(d)}function esc(s=""){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function sorted(){return[...data].sort((a,b)=>rank(a.priority)-rank(b.priority)||+a.duration-+b.duration||new Date(a.createdAt)-new Date(b.createdAt))}function render(){const all=sorted(),selected=filter?filter.value:"alle",s=selected==="alle"?all:all.filter(e=>e.priority===selected);count.textContent=s.length+" "+(s.length===1?"Eintrag":"Einträge")+(selected!=="alle"?" im Filter":"");entries.innerHTML=s.length?s.map(e=>`<article class="entry" data-id="${e.id}" data-p="${e.priority}"><div class="bar"></div><div><div class="title">${esc(e.todo)}</div><div class="meta"><span class="tag ptag">${plabel(e.priority)}</span><span class="tag">${dlabel(e.duration)}</span><span class="tag">${fdate(e.createdAt)}</span></div></div><div class="entryactions"><button class="icon" data-a="edit" aria-label="Bearbeiten" title="Bearbeiten">✎</button><button class="icon del" data-a="delete" aria-label="Löschen" title="Löschen">×</button></div></article>`).join(""):`<div class="empty"><strong>Keine Einträge</strong>${selected==="alle"?"Ideen und Aufgaben erscheinen nach dem Speichern hier.":"Für diesen Filter liegen keine Einträge vor."}</div>`}function showList(){capture.classList.remove("active");list.classList.add("active");render();scrollTo({top:0,behavior:"smooth"})}function showCapture(){list.classList.remove("active");capture.classList.add("active");scrollTo({top:0,behavior:"smooth"});setTimeout(()=>todo.focus(),200)}$("form").addEventListener("submit",e=>{e.preventDefault();const text=todo.value.trim();if(!text)return;data.push({id:uid(),todo:text,duration:+duration.value,priority:priority.value,createdAt:new Date().toISOString()});save();e.target.reset();duration.value="30";priority.value="normal";setDate();$("feedback").textContent="Eintrag wurde übernommen.";setTimeout(()=>$("feedback").textContent="",2200);todo.focus()});$("openList").onclick=showList;$("back").onclick=showCapture;filter.onchange=render;entries.addEventListener("click",e=>{const b=e.target.closest("[data-a]"),item=e.target.closest("[data-id]");if(!b||!item)return;const x=data.find(v=>v.id===item.dataset.id);if(!x)return;if(b.dataset.a==="delete"&&confirm(`„${x.todo}“ wirklich löschen?`)){data=data.filter(v=>v.id!==x.id);save()}if(b.dataset.a==="edit"){$("editId").value=x.id;$("editTodo").value=x.todo;$("editDuration").value=String(x.duration);$("editPriority").value=x.priority;modal.classList.add("open")}});$("editForm").addEventListener("submit",e=>{e.preventDefault();const x=data.find(v=>v.id===$("editId").value);if(!x)return;x.todo=$("editTodo").value.trim();x.duration=+$("editDuration").value;x.priority=$("editPriority").value;modal.classList.remove("open");save()});$("cancel").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};function ce(v){return'"'+String(v??"").replaceAll('"','""')+'"'}function parse(line){const r=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===';'&&!q){r.push(c);c=""}else c+=ch}r.push(c);return r}$("export").onclick=()=>{const rows=[["ID","ToDo","Dauer_Minuten","Dringlichkeit","Eingetragen_Am"],...sorted().map(x=>[x.id,x.todo,x.duration,x.priority,x.createdAt])];const csv="\uFEFF"+rows.map(r=>r.map(ce).join(";")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="ideen-und-aufgaben-"+new Date().toISOString().slice(0,10)+".csv";a.click();URL.revokeObjectURL(url)};$("import").onclick=()=>file.click();file.onchange=async()=>{const f=file.files&&file.files[0];if(!f)return;try{const lines=(await f.text()).replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim()),head=parse(lines[0]),exp=["ID","ToDo","Dauer_Minuten","Dringlichkeit","Eingetragen_Am"];if(exp.some((x,i)=>head[i]!==x))throw 0;const imp=lines.slice(1).map(l=>{const r=parse(l);return{id:r[0]||uid(),todo:r[1]||"",duration:+r[2]||30,priority:["dringend","normal","bei-gelegenheit"].includes(r[3])?r[3]:"normal",createdAt:r[4]||new Date().toISOString()}}).filter(x=>x.todo.trim());if(confirm(imp.length+" Einträge importieren und vorhandene Einträge ersetzen?")){data=imp;save()}}catch{alert("Die CSV-Datei konnte nicht gelesen werden.")}finally{file.value=""}}})();
</script>
</body>
</html>
